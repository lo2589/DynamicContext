name: standard

provider:
  type: ollama
  config: provider.json

chat:
  type: normal
  tools: none
  search: none

answer:
  parser: normal
  outputs:
    think:
      role: assistant
    assistant:
      role: assistant

input_data:
  type: real_user
  path: null
  interface: input   # 改成 gui + 打开 runtime.viewer.enabled：改从网页输入框发消息，终端只剩日志

life_cycle:
  system: [1, null]
  user: [born, null]
  think: [born, born]
  assistant: [born, null]

compact:
  fields: [user, assistant, think]
  overload_threshold_bytes: 32000
  compressors:
    summary:
      prompt: "Summarize only the useful facts, conclusions, and open items from this conversation: {content}"
      periodic:
        interval_turns: 20
        keep_recent_turns: 10

dataset:
  type: local
  kwargs:
    path: ../../task/standard
    tables:
      history: history.jsonl
      state: state_latest.json
      context: context_latest.json
      life_cycle: life_cycle.json
      patches: patches.jsonl
      compression: compression
      raw: raw_history.jsonl

recall: &recall
  type: none
  build: none
  recall: none
  update: none
  trigger: manual

runtime:
  system:
    content: You are a concise assistant.
    range: [[[1, null], 1.0, none]]
  stream: true
  print:
    type: tables
  viewer:
    enabled: false   # true 时 runtime.run 启动即在后台起 viewer.html 实时服务并开浏览器
    port: 8777
    interval: 1.0
    open: true

context:
  selector: none
  required_elements: [user, assistant]
  roles:
    goal: user
    constraint: user
    answer: assistant
  patch_end:
    enabled: true
    template: "以上{element}已经结束，不再继续执行：{content}。请按当前用户请求正常回答。"
  patches: {}
